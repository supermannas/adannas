<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Academic technology and responsible AI</title>
  <desc id="desc">An abstract constellation of human judgment, learning design, and responsible artificial intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b14"/><stop offset=".52" stop-color="#111522"/><stop offset="1" stop-color="#090b12"/></linearGradient>
